blueprint:
  name: Baby Calendar medication reminder
  description: >-
    Runs your actions whenever a dose of any baby's medication becomes due,
    and optionally repeats them until the dose is recorded. One automation
    covers every medication, including medications added later. Baby
    Calendar sends no notifications itself: it fires the event
    baby_calendar_medication_due, which this automation acts on.


    In your actions, `baby`, `medication` and `dose` hold the names and the
    dose text, and `button` the medication's dose button. A notification
    action whose id is `BABY_CALENDAR_DOSE:{{ button }}` records the dose
    when chosen.
  domain: automation
  source_url: https://github.com/mpadinhabrandao/ha-baby-calendar/blob/main/blueprints/automation/baby_calendar/medication_reminder.yaml
  input:
    reminder:
      name: Actions
      description: >-
        What to do, such as notifying phones. Use {{ baby }}, {{ medication }}
        and {{ dose }} in messages; add a notification action with the id
        BABY_CALENDAR_DOSE:{{ button }} to record the dose from the
        notification.
      selector:
        action: {}
    repeat_minutes:
      name: Repeat every
      description: Run the actions again while the dose is still due. 0 runs them once.
      default: 0
      selector:
        number:
          min: 0
          max: 240
          step: 5
          unit_of_measurement: min
          mode: box
    babies:
      name: Babies
      description: Only these babies. Leave empty for every baby.
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: baby_calendar
    handle_given:
      name: Record the dose from the notification
      description: >-
        Press the medication's dose button when the notification action
        BABY_CALENDAR_DOSE:<button> is chosen.
      default: true
      selector:
        boolean: {}

mode: parallel
max: 50
max_exceeded: silent

triggers:
  - trigger: event
    event_type: baby_calendar_medication_due
    id: due
  - trigger: event
    event_type: mobile_app_notification_action
    id: given

variables:
  repeat_minutes: !input repeat_minutes
  babies: !input babies
  handle_given: !input handle_given

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: due
          - condition: template
            value_template: >-
              {{ not babies or trigger.event.data.device_id in babies }}
        sequence:
          - variables:
              baby: "{{ trigger.event.data.baby }}"
              medication: "{{ trigger.event.data.medication }}"
              dose: "{{ trigger.event.data.dose or '' }}"
              button: "{{ trigger.event.data.button_entity }}"
              due_entity: "{{ trigger.event.data.due_entity }}"
          - sequence: !input reminder
          - if:
              - condition: template
                value_template: "{{ repeat_minutes | int(0) > 0 }}"
            then:
              - repeat:
                  while:
                    - condition: template
                      value_template: "{{ is_state(due_entity, 'on') }}"
                  sequence:
                    - wait_template: "{{ not is_state(due_entity, 'on') }}"
                      timeout:
                        minutes: "{{ repeat_minutes | int }}"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ is_state(due_entity, 'on') }}"
                      then:
                        - sequence: !input reminder
      - conditions:
          - condition: trigger
            id: given
          - condition: template
            value_template: >-
              {{ handle_given
                 and (trigger.event.data.action | default('')) is string
                 and trigger.event.data.action.startswith('BABY_CALENDAR_DOSE:button.') }}
        sequence:
          - action: button.press
            target:
              entity_id: "{{ trigger.event.data.action.split(':', 1)[1] }}"
