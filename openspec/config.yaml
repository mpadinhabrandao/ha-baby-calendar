schema: spec-driven

context: |
  Project: Baby Calendar, a Home Assistant custom integration (domain `baby_calendar`,
  repo `ha-baby-calendar`) distributed through HACS. MIT licensed.
  Besides entities, services and a calendar entity, it ships its own dashboard cards
  (frontend/, TypeScript and Lit, bundled into custom_components/baby_calendar/frontend/
  and registered by the integration). Cards call the integration's services and read
  its entities; every rule stays in the integration. Dashboards are built by the user
  from these cards and any others.
  All data stays local in Home Assistant. No cloud services, no outbound network calls.
  It records and displays data only. It never interprets data or gives health advice.
  Code, entity names, service names and OpenSpec artifacts are written in English.
  User-facing strings are translated to English and Portuguese (pt).
  Core idea: a fixed set of purpose-built trackers, each with behaviour designed for it.
  The user chooses which trackers are enabled per baby.
  Logging must work one-handed at night: one tap logs, details are optional follow-ups,
  inputs never silently reuse a stale value, and a slip is undone with one tap.
  Changes, in implementation order:
    1. add-core-tracking (baby, diaper, bottle, undo, back-dating)
    2. add-timed-tracking (breastfeeding, sleep, combined last feed)
    3. add-calendar-view
    4. add-medication-reminders
    5. add-measurements (weight, length, temperature)
    6. add-solids-tracking
    7. add-pumping-tracking
    8. add-baby-dashboard (superseded by add-baby-card; only its attributes remain)
    9. add-baby-card
  Each later change extends services defined in add-core-tracking (update_event,
  list_events, the tracker list). Until that change is archived these extensions are
  written as new requirements in the later change, not as MODIFIED deltas.
  Deferred, not planned for now: an ICS feed for phone calendar apps and user-defined
  trackers.
  These specs were revised on 2026-11-16 after an independent review.

