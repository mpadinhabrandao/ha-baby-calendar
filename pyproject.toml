[project]
name = "ha-baby-calendar"
version = "0.1.0"
description = "Home Assistant custom integration to log a baby's day"
license = "MIT"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D203", # conflicts with D211
    "D213", # conflicts with D212
    "E501", # line length is left to the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.baby_calendar"]
