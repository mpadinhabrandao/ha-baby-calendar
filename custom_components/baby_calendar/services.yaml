log_diaper:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: baby_calendar
    content:
      required: true
      selector:
        select:
          translation_key: diaper_content
          options:
            - wet
            - dirty
            - both
    stool:
      selector:
        select:
          translation_key: stool
          options:
            - normal
            - soft
            - hard
            - diarrhea
    notes:
      selector:
        text:
          multiline: true
    time:
      selector:
        datetime:

log_bottle:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: baby_calendar
    amount:
      required: true
      example: 90
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: mL
          mode: box
    content:
      selector:
        select:
          translation_key: bottle_content
          options:
            - formula
            - breast_milk
    notes:
      selector:
        text:
          multiline: true
    time:
      selector:
        datetime:

log_weight:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: baby_calendar
    value:
      required: true
      example: 3450
      selector:
        number:
          min: 300
          max: 30000
          step: 1
          unit_of_measurement: "g"
          mode: box
    notes:
      selector:
        text:
          multiline: true
    time:
      selector:
        datetime:

log_length:
